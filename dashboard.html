<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iBrain | 학생 관리</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1b2f4b" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg width="20" height="18" viewBox="0 0 44 40" fill="none">
        <polygon points="22,2 40,12 40,28 22,38 4,28 4,12" fill="none" stroke="#fff" stroke-width="3"/>
        <polygon points="22,11 32,17 32,25 22,31 12,25 12,17" fill="#d98a3d"/>
      </svg>
      iBrain
    </div>
    <div class="brand-sub">테스트지 평가 시스템</div>
    <nav>
      <a href="dashboard.html" class="active">학생 목록</a>
      <a href="admin.html" id="adminLink" style="display:none;">관리자 페이지</a>
    </nav>
    <div class="spacer"></div>
    <div class="user-email" id="userEmail"></div>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h2>학생 목록</h2>
        <div class="count" id="studentCount">불러오는 중...</div>
      </div>
      <button class="btn-accent" id="addStudentBtn">+ 학생 추가</button>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="이름으로 검색" />
    </div>

    <div id="studentGrid" class="student-grid"></div>
  </main>
</div>

<!-- 학생 추가/수정 모달 -->
<div class="modal-overlay" id="studentModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="studentModalTitle">학생 추가</h3>
      <button class="modal-close" data-close="studentModal">&times;</button>
    </div>
    <form id="studentForm">
      <input type="hidden" id="studentId" />
      <div class="field">
        <label>아이 이름</label>
        <input type="text" id="f_name" required />
      </div>
      <div class="grid-2">
        <div class="field">
          <label>생년월일</label>
          <input type="date" id="f_birthdate" />
        </div>
        <div class="field">
          <label>소속 기관</label>
          <input type="text" id="f_institution" />
        </div>
      </div>
      <div class="field">
        <label>주소</label>
        <input type="text" id="f_address" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label>보호자 성함</label>
          <input type="text" id="f_guardianName" />
        </div>
        <div class="field">
          <label>연락처</label>
          <input type="tel" id="f_phone" placeholder="010-0000-0000" />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteStudentBtn" style="display:none;">학생 삭제</button>
        <div class="right">
          <button type="button" class="btn-ghost" data-close="studentModal">취소</button>
          <button type="submit" class="btn-primary">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- 학생 상세 (평가 기록) 모달 -->
<div class="modal-overlay" id="detailModal" style="display:none;">
  <div class="modal-box wide">
    <div class="modal-head">
      <h3 id="detailName">학생 이름</h3>
      <button class="modal-close" data-close="detailModal">&times;</button>
    </div>
    <div id="detailMeta" style="font-size:13px; color:var(--text-mute); line-height:1.9; margin-bottom:8px;"></div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <button class="btn-ghost btn-sm" id="editStudentBtn">학생 정보 수정</button>
    </div>

    <div class="section-title">평가 기록</div>
    <button class="btn-accent btn-sm" id="addEvalBtn" style="margin-bottom:12px;">+ 새 평가 입력</button>
    <div id="evalHistoryList"></div>
  </div>
</div>

<!-- 평가 입력/수정 모달 -->
<div class="modal-overlay" id="evalModal" style="display:none;">
  <div class="modal-box wide">
    <div class="modal-head">
      <h3 id="evalModalTitle">평가 입력</h3>
      <button class="modal-close" data-close="evalModal">&times;</button>
    </div>
    <form id="evalForm">
      <input type="hidden" id="e_studentId" />
      <input type="hidden" id="e_evalId" />
      <div class="grid-2" style="margin-bottom:16px;">
        <div class="field">
          <label>평가일</label>
          <input type="date" id="e_testDate" required />
        </div>
        <div class="field">
          <label>연령대 / 교재 단계</label>
          <input type="text" id="e_ageGroup" placeholder="예: 7세" />
        </div>
      </div>

      <div id="eval1ItemFields"></div>

      <div class="eval-layout">
        <div id="scoreFields"></div>
        <div class="chart-panel">
          <div class="charts-dual">
            <div>
              <div class="chart-sub-label">평가1 · 육각형</div>
              <div class="hex-wrap">
                <div id="evalChartPreview"></div>
                <svg id="evalChartAdvancedOverlay" class="advanced-overlay-svg"></svg>
              </div>
            </div>
            <div>
              <div class="chart-sub-label">평가2 · 오각형</div>
              <div id="evalChartPreview2"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="evalExplain"></div>
      <div id="evalExplain2"></div>
      <div id="evalFinalSummary"></div>

      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteEvalBtn" style="display:none;">평가 삭제</button>
        <div class="right">
          <button type="button" class="btn-ghost" data-close="evalModal">취소</button>
          <button type="submit" class="btn-primary">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    watchStudents, addStudent, updateStudent, deleteStudent,
    watchEvaluations, addEvaluation, updateEvaluation, deleteEvaluation,
  } from "./students.js";
  import { renderHexagonChart, renderPentagonChart, CATEGORIES, CATEGORIES_2, SCALE_LABELS } from "./hexagon-chart.js";
  import { loadEvalData, guessAge, getDomainExplain, generateOverall } from "./eval-explain.js";
  import { loadEval2Data, getDomain2Explain, generateOverall2, generateFinalSummary, SCALE_LABELS_2 } from "./eval2-explain.js";
  import {
    computeNormalAverage, computeAdvancedFlag, renderAdvancedOverlay,
    NORMAL_ITEM_COUNT, ADVANCED_MASTERY_THRESHOLD,
  } from "./advanced-eval.js";

  loadEvalData();
  loadEval2Data();

  let currentUid = null;
  let allStudents = [];
  let currentStudent = null;
  let currentScores = {};
  let currentNormalItems = {}; // 평가1: { su: [n1,n2,n3], ... } 미입력은 null
  let currentAdvanced = {};    // 평가1: { su: 5, ... } 미입력은 null
  let currentAdvancedFlags = {}; // 평가1: { su: true/false } (파생값)
  let unsubEvals = null;

  // ---------- 인증 확인 ----------
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (!userDoc.exists() || !userDoc.data().approved) {
      await signOut(auth);
      window.location.href = "index.html";
      return;
    }
    currentUid = user.uid;
    document.getElementById("userEmail").textContent = user.email;
    if (userDoc.data().isAdmin) document.getElementById("adminLink").style.display = "block";
    watchStudents((list) => { allStudents = list; renderStudentGrid(); });
  });

  document.getElementById("logoutBtn").onclick = () => signOut(auth).then(() => window.location.href = "index.html");

  // ---------- 모달 공통 ----------
  document.querySelectorAll("[data-close]").forEach((btn) => {
    btn.onclick = () => closeModal(btn.dataset.close);
  });
  function openModal(id) { document.getElementById(id).style.display = "flex"; }
  function closeModal(id) {
    document.getElementById(id).style.display = "none";
    if (id === "detailModal" && unsubEvals) { unsubEvals(); unsubEvals = null; }
  }

  // ---------- 학생 목록 ----------
  function renderStudentGrid() {
    const term = document.getElementById("searchInput").value.trim().toLowerCase();
    const filtered = allStudents.filter((s) => (s.name || "").toLowerCase().includes(term));
    document.getElementById("studentCount").textContent = `총 ${allStudents.length}명`;
    const grid = document.getElementById("studentGrid");
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">등록된 학생이 없습니다. "학생 추가" 버튼으로 시작해 보세요.</div>`;
      return;
    }
    grid.innerHTML = filtered.map((s) => `
      <div class="student-card" data-id="${s.id}">
        <div class="name">${escapeHtml(s.name || "이름 없음")}</div>
        <div class="meta">
          생년월일: ${s.birthdate || "-"}<br/>
          소속: ${escapeHtml(s.institution || "-")}<br/>
          보호자: ${escapeHtml(s.guardianName || "-")}
        </div>
      </div>
    `).join("");
    grid.querySelectorAll(".student-card").forEach((card) => {
      card.onclick = () => openDetail(card.dataset.id);
    });
  }
  document.getElementById("searchInput").addEventListener("input", renderStudentGrid);

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  // ---------- 학생 추가/수정 ----------
  document.getElementById("addStudentBtn").onclick = () => {
    document.getElementById("studentModalTitle").textContent = "학생 추가";
    document.getElementById("studentForm").reset();
    document.getElementById("studentId").value = "";
    document.getElementById("deleteStudentBtn").style.display = "none";
    openModal("studentModal");
  };

  document.getElementById("editStudentBtn").onclick = () => {
    fillStudentForm(currentStudent);
    document.getElementById("studentModalTitle").textContent = "학생 정보 수정";
    document.getElementById("deleteStudentBtn").style.display = "inline-block";
    openModal("studentModal");
  };

  function fillStudentForm(s) {
    document.getElementById("studentId").value = s.id;
    document.getElementById("f_name").value = s.name || "";
    document.getElementById("f_birthdate").value = s.birthdate || "";
    document.getElementById("f_institution").value = s.institution || "";
    document.getElementById("f_address").value = s.address || "";
    document.getElementById("f_guardianName").value = s.guardianName || "";
    document.getElementById("f_phone").value = s.phone || "";
  }

  document.getElementById("studentForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("studentId").value;
    const data = {
      name: document.getElementById("f_name").value.trim(),
      birthdate: document.getElementById("f_birthdate").value,
      institution: document.getElementById("f_institution").value.trim(),
      address: document.getElementById("f_address").value.trim(),
      guardianName: document.getElementById("f_guardianName").value.trim(),
      phone: document.getElementById("f_phone").value.trim(),
    };
    if (id) {
      await updateStudent(id, data);
      if (currentStudent && currentStudent.id === id) { currentStudent = { ...currentStudent, ...data }; renderDetailMeta(); }
    } else {
      await addStudent(data, currentUid);
    }
    closeModal("studentModal");
  });

  document.getElementById("deleteStudentBtn").onclick = async () => {
    const id = document.getElementById("studentId").value;
    if (!id) return;
    if (!confirm("이 학생의 모든 정보와 평가 기록이 삭제됩니다. 계속할까요?")) return;
    await deleteStudent(id);
    closeModal("studentModal");
    closeModal("detailModal");
  };

  // ---------- 학생 상세 / 평가 기록 ----------
  function openDetail(id) {
    const s = allStudents.find((x) => x.id === id);
    if (!s) return;
    currentStudent = s;
    document.getElementById("detailName").textContent = s.name || "이름 없음";
    renderDetailMeta();
    openModal("detailModal");
    if (unsubEvals) unsubEvals();
    unsubEvals = watchEvaluations(id, renderEvalHistory);
  }

  function renderDetailMeta() {
    const s = currentStudent;
    document.getElementById("detailMeta").innerHTML = `
      생년월일: ${s.birthdate || "-"} &nbsp;·&nbsp; 소속: ${escapeHtml(s.institution || "-")}<br/>
      보호자: ${escapeHtml(s.guardianName || "-")} &nbsp;·&nbsp; 연락처: ${escapeHtml(s.phone || "-")}<br/>
      주소: ${escapeHtml(s.address || "-")}
    `;
  }

  let currentEvals = [];
  function renderEvalHistory(list) {
    currentEvals = list;
    const box = document.getElementById("evalHistoryList");
    if (list.length === 0) {
      box.innerHTML = `<div class="empty-state">아직 평가 기록이 없습니다.</div>`;
      return;
    }
    box.innerHTML = list.map((ev) => `
      <div class="eval-history-item">
        <div>
          <span class="date">${ev.testDate || "날짜 미입력"}</span>
          <span class="age">${escapeHtml(ev.ageGroup || "")}</span>
        </div>
        <div class="actions">
          <button class="btn-ghost btn-sm" data-view="${ev.id}">보기/수정</button>
        </div>
      </div>
    `).join("");
    box.querySelectorAll("[data-view]").forEach((btn) => {
      btn.onclick = () => openEvalModal(btn.dataset.view);
    });
  }

  document.getElementById("addEvalBtn").onclick = () => openEvalModal(null);

  function buildScoreSection(categories, scores, sectionClass, sectionTitle, labels) {
    return `
      <div class="eval-section-title ${sectionClass}">${sectionTitle}</div>
      ${categories.map((c) => `
        <div class="score-group">
          <div class="cat-label"><span>${c.label}</span><span class="val" id="val_${c.key}">${labelFor(scores[c.key], labels)}</span></div>
          <div class="score-buttons ${sectionClass}" data-key="${c.key}">
            ${labels.map((o) => `<button type="button" data-n="${o.score}" class="${scores[c.key] === o.score ? "selected" : ""}">${o.label}</button>`).join("")}
          </div>
        </div>
      `).join("")}
    `;
  }

  function labelFor(n, labels) {
    const found = (labels || SCALE_LABELS).find((o) => o.score === n);
    return found ? found.label : "-";
  }

  function buildScoreFields(scores) {
    const box = document.getElementById("scoreFields");
    box.innerHTML = buildScoreSection(CATEGORIES_2, scores, "pentagon", "평가2 · 5개 영역 (오각형)", SCALE_LABELS_2);
    box.querySelectorAll(".score-buttons").forEach((group) => {
      const key = group.dataset.key;
      const labels = SCALE_LABELS_2;
      group.querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => {
          const n = Number(btn.dataset.n);
          currentScores[key] = n;
          group.querySelectorAll("button").forEach((b) => b.classList.toggle("selected", Number(b.dataset.n) === n));
          document.getElementById(`val_${key}`).textContent = labelFor(n, labels);
          updateChartPreview();
          renderExplain();
          renderExplain2();
          renderFinalSummary();
        };
      });
    });
  }

  // ---------- 평가1: 문항별(일반3 + 고난도1) 채점 ----------
  function recomputeEval1Scores() {
    CATEGORIES.forEach((c) => {
      const { average } = computeNormalAverage(currentNormalItems[c.key]);
      if (average == null) delete currentScores[c.key];
      else currentScores[c.key] = average;
      currentAdvancedFlags[c.key] = computeAdvancedFlag(currentAdvanced[c.key]);
    });
  }

  function buildEval1ItemFields() {
    const box = document.getElementById("eval1ItemFields");
    const scoreOptions = (selected) => [0, 1, 2, 3, 4, 5].map((n) =>
      `<option value="${n}" ${selected === n ? "selected" : ""}>${n}</option>`
    ).join("");

    box.innerHTML = `
      <div class="eval-section-title hexagon">평가1 · 문항별 채점 (일반 ${NORMAL_ITEM_COUNT}문항 + ★고난도 1문항)</div>
      <div class="item-domain-grid">
        ${CATEGORIES.map((c) => {
          const items = currentNormalItems[c.key] || [];
          const adv = currentAdvanced[c.key];
          const { average, answeredCount, total } = computeNormalAverage(items);
          const isMastery = computeAdvancedFlag(adv);
          return `
            <div class="item-domain-block">
              <div class="item-domain-head">
                <span>${c.label}</span>
                <span class="item-domain-avg">
                  ${average != null ? `평균 ${average.toFixed(2)}점` : "미입력"} (${answeredCount}/${total})
                  ${isMastery ? '<span class="mastery-badge">★ 월등</span>' : ""}
                </span>
              </div>
              <div class="item-rows">
                ${Array.from({ length: NORMAL_ITEM_COUNT }).map((_, qi) => `
                  <div class="item-row">
                    <span class="item-row-label">일반 ${qi + 1}</span>
                    <select data-domain="${c.key}" data-type="normal" data-idx="${qi}">
                      <option value="">-</option>
                      ${scoreOptions(items[qi] != null ? items[qi] : null)}
                    </select>
                  </div>
                `).join("")}
                <div class="item-row advanced-row">
                  <span class="item-row-label">★ 고난도</span>
                  <select data-domain="${c.key}" data-type="advanced">
                    <option value="">-</option>
                    ${scoreOptions(adv != null ? adv : null)}
                  </select>
                </div>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;

    box.querySelectorAll("select").forEach((sel) => {
      sel.onchange = () => {
        const domain = sel.dataset.domain;
        const val = sel.value === "" ? null : Number(sel.value);
        if (sel.dataset.type === "normal") {
          const idx = Number(sel.dataset.idx);
          if (!currentNormalItems[domain]) currentNormalItems[domain] = [];
          currentNormalItems[domain][idx] = val;
        } else {
          currentAdvanced[domain] = val;
        }
        recomputeEval1Scores();
        buildEval1ItemFields();
        updateChartPreview();
        renderExplain();
        renderExplain2();
        renderFinalSummary();
      };
    });
  }

  function updateChartPreview() {
    renderHexagonChart(document.getElementById("evalChartPreview"), currentScores, { size: 240 });
    renderAdvancedOverlay(document.getElementById("evalChartAdvancedOverlay"), CATEGORIES, currentAdvancedFlags, { size: 240 });
    renderPentagonChart(document.getElementById("evalChartPreview2"), currentScores, { size: 240 });
  }

  // ---------- 평가 설명 / 종합 평가 (읽기 전용, 그래프·점수 로직과 무관) ----------
  function renderExplain() {
    const box = document.getElementById("evalExplain");
    if (!box) return;
    const ageGroupText = document.getElementById("e_ageGroup").value;
    const testDate = document.getElementById("e_testDate").value;
    const birthdate = currentStudent ? currentStudent.birthdate : "";
    const age = guessAge(ageGroupText, birthdate, testDate);

    const answered = CATEGORIES.filter((c) => currentScores[c.key] != null);
    if (answered.length === 0) {
      box.innerHTML = `<div class="explain-empty">평가1(육각형) 영역 점수를 입력하면 영역별 설명과 종합 평가가 여기에 자동으로 나와요.</div>`;
      return;
    }

    const ageNotice = age == null
      ? `<div class="explain-empty" style="margin-bottom:12px;">학생 생년월일 또는 연령대가 입력되지 않아 8세 기준 문구로 표시 중이에요. 정확한 설명을 보려면 생년월일 또는 연령대를 입력해주세요.</div>`
      : "";

    const domainCards = CATEGORIES.map((c) => {
      if (currentScores[c.key] == null) return "";
      const info = getDomainExplain(age, c.key, currentScores[c.key]);
      if (!info) return "";
      const masteryNote = currentAdvancedFlags[c.key]
        ? `<p class="explain-text mastery-note">★ 특히 일반적인 수준의 문제를 넘어선 고난도 문제에서도 높은 수행을 보여, ${info.label} 영역에서 특별히 뛰어난 사고 특성이 관찰되었습니다.</p>`
        : "";
      return `
        <div class="explain-card">
          <div class="explain-card-head"><span>${info.label}</span><span class="explain-score">평균 ${Number(currentScores[c.key]).toFixed(2)}점</span></div>
          <p class="explain-text">${info.text || "설명을 불러오는 중이거나 준비되지 않았습니다."}</p>
          ${masteryNote}
          ${info.activities.length ? `<div class="explain-activities">추천 활동: ${info.activities.join(", ")}</div>` : ""}
        </div>
      `;
    }).join("");

    const allAnswered = CATEGORIES.every((c) => currentScores[c.key] != null);
    let overallHtml;
    if (!allAnswered) {
      overallHtml = `<div class="explain-empty">평가1의 6개 영역 점수를 모두 입력하면 종합 평가(강점·추천활동·수업방향)가 표시돼요. (현재 ${answered.length}/6개 입력됨)</div>`;
    } else {
      const overall = generateOverall(currentScores);
      overallHtml = overall ? `
        <div class="explain-overall">
          <div class="explain-overall-title">${overall.title}</div>
          ${overall.strengths.length ? `<div class="explain-row"><b>강점 영역</b> ${overall.strengths.map((d) => d.label).join(", ")}</div>` : ""}
          ${overall.growth.length ? `<div class="explain-row"><b>더 경험해보면 좋은 영역</b> ${overall.growth.map((d) => d.label).join(", ")}</div>` : ""}
          ${overall.notes.map((n) => `<p class="explain-text">${n}</p>`).join("")}
          ${overall.activities.length ? `<div class="explain-row"><b>추천 사고력 활동</b> ${overall.activities.join(", ")}</div>` : ""}
          <div class="explain-row"><b>아이브레인 수업 방향</b> ${overall.direction}</div>
          <div class="explain-disclaimer">${overall.note || ""}</div>
        </div>
      ` : "";
    }

    box.innerHTML = `
      <div class="section-title" style="margin-top:22px;">영역별 평가 설명 (평가1 기준)</div>
      ${ageNotice}
      <div class="explain-grid">${domainCards}</div>
      ${overallHtml}
    `;
  }

  // ---------- 평가2 설명 / 종합 평가 (평가1과 완전히 독립) ----------
  function renderExplain2() {
    const box = document.getElementById("evalExplain2");
    if (!box) return;
    const answered = CATEGORIES_2.filter((c) => currentScores[c.key] != null);
    if (answered.length === 0) {
      box.innerHTML = `<div class="explain-empty">평가2(오각형) 영역 점수를 입력하면 영역별 설명과 종합 평가가 여기에 자동으로 나와요.</div>`;
      return;
    }

    const domainCards = CATEGORIES_2.map((c) => {
      if (currentScores[c.key] == null) return "";
      const info = getDomain2Explain(c.key, currentScores[c.key]);
      if (!info) return "";
      return `
        <div class="explain-card">
          <div class="explain-card-head"><span>${info.label}</span><span class="explain-score">${info.score}점 · ${info.level}</span></div>
          <p class="explain-text">${info.text || "설명을 불러오는 중이거나 준비되지 않았습니다."}</p>
        </div>
      `;
    }).join("");

    const allAnswered = CATEGORIES_2.every((c) => currentScores[c.key] != null);
    let overallHtml;
    if (!allAnswered) {
      overallHtml = `<div class="explain-empty">평가2 ${answered.length}/5 입력 — 5개 영역을 모두 입력하면 종합 평가가 표시돼요.</div>`;
    } else {
      const overall = generateOverall2(currentScores, currentScores);
      overallHtml = overall ? `
        <div class="explain-overall pentagon">
          <div class="explain-overall-title">${overall.title}</div>
          <p class="explain-text">${overall.levelText}</p>
          ${overall.strengths.length ? `<div class="explain-row"><b>이해도와 성취 수준</b> ${overall.strengths.map((d) => d.label).join(", ")} 영역이 강점으로 나타납니다.</div>` : ""}
          ${overall.growth.length ? `<div class="explain-row"><b>흥미와 태도</b> ${overall.growth.map((d) => d.label).join(", ")} 영역은 조금 더 경험이 필요해 보입니다.</div>` : ""}
          ${overall.gapNote ? `<p class="explain-text">${overall.gapNote}</p>` : ""}
          ${overall.notes.map((n) => `<p class="explain-text">${n}</p>`).join("")}
          <div class="explain-row"><b>아이브레인 수업 방향</b> ${overall.direction}</div>
          <div class="explain-disclaimer">${overall.note || ""}</div>
        </div>
      ` : "";
    }

    box.innerHTML = `
      <div class="section-title pentagon" style="margin-top:22px;">영역별 평가 설명 (평가2 기준)</div>
      <div class="explain-grid">${domainCards}</div>
      ${overallHtml}
    `;
  }

  // ---------- 평가1 + 평가2 통합 최종 종합 평가 ----------
  function renderFinalSummary() {
    const box = document.getElementById("evalFinalSummary");
    if (!box) return;
    const allE1 = CATEGORIES.every((c) => currentScores[c.key] != null);
    const allE2 = CATEGORIES_2.every((c) => currentScores[c.key] != null);
    if (!allE1 || !allE2) { box.innerHTML = ""; return; }
    const summary = generateFinalSummary(currentScores, currentScores);
    if (!summary) { box.innerHTML = ""; return; }
    box.innerHTML = `
      <div class="explain-overall final-summary" style="margin-top:22px;">
        <div class="explain-overall-title">${summary.title}</div>
        <p class="explain-text">${summary.text}</p>
      </div>
    `;
  }

  function openEvalModal(evalId) {
    document.getElementById("e_studentId").value = currentStudent.id;
    document.getElementById("e_evalId").value = evalId || "";
    if (evalId) {
      const ev = currentEvals.find((x) => x.id === evalId);
      document.getElementById("evalModalTitle").textContent = "평가 수정";
      document.getElementById("e_testDate").value = ev.testDate || "";
      document.getElementById("e_ageGroup").value = ev.ageGroup || "";
      currentScores = { ...(ev.scores || {}) };
      if (ev.normalItemScores && Object.keys(ev.normalItemScores).length > 0) {
        // 이번 기능으로 저장된 평가 기록
        currentNormalItems = {};
        CATEGORIES.forEach((c) => { currentNormalItems[c.key] = [...(ev.normalItemScores[c.key] || [])]; });
      } else {
        // 이 기능 이전에 저장된 기존 평가 기록: 기존 단일 점수를 "일반1"에 넣어 값이 사라지지 않게 함
        currentNormalItems = {};
        CATEGORIES.forEach((c) => {
          const legacy = ev.scores ? ev.scores[c.key] : null;
          currentNormalItems[c.key] = legacy != null ? [legacy, null, null] : [null, null, null];
        });
      }
      currentAdvanced = { ...(ev.advancedScores || {}) };
      document.getElementById("deleteEvalBtn").style.display = "inline-block";
    } else {
      document.getElementById("evalModalTitle").textContent = "평가 입력";
      document.getElementById("e_testDate").value = new Date().toISOString().slice(0, 10);
      document.getElementById("e_ageGroup").value = "";
      currentScores = {};
      currentNormalItems = {};
      currentAdvanced = {};
      document.getElementById("deleteEvalBtn").style.display = "none";
    }
    recomputeEval1Scores();
    buildEval1ItemFields();
    buildScoreFields(currentScores);
    updateChartPreview();
    renderExplain();
    renderExplain2();
    renderFinalSummary();
    loadEvalData().then(() => renderExplain()); // json 로딩이 늦게 끝나는 경우 대비
    loadEval2Data().then(() => renderExplain2());
    openModal("evalModal");
  }

  document.getElementById("e_testDate").addEventListener("change", renderExplain);
  document.getElementById("e_ageGroup").addEventListener("input", renderExplain);

  document.getElementById("evalForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const studentId = document.getElementById("e_studentId").value;
    const evalId = document.getElementById("e_evalId").value;
    const missing = [...CATEGORIES, ...CATEGORIES_2].filter((c) => currentScores[c.key] == null);
    if (missing.length > 0) {
      alert("모든 영역의 점수를 선택해 주세요: " + missing.map((c) => c.label).join(", "));
      return;
    }
    const data = {
      testDate: document.getElementById("e_testDate").value,
      ageGroup: document.getElementById("e_ageGroup").value.trim(),
      scores: currentScores,
      normalItemScores: currentNormalItems,
      advancedScores: currentAdvanced,
      advancedFlags: currentAdvancedFlags,
    };
    if (evalId) {
      await updateEvaluation(studentId, evalId, data);
    } else {
      await addEvaluation(studentId, data, currentUid);
    }
    closeModal("evalModal");
  });

  document.getElementById("deleteEvalBtn").onclick = async () => {
    const studentId = document.getElementById("e_studentId").value;
    const evalId = document.getElementById("e_evalId").value;
    if (!evalId) return;
    if (!confirm("이 평가 기록을 삭제할까요?")) return;
    await deleteEvaluation(studentId, evalId);
    closeModal("evalModal");
  };
</script>
</body>
</html>
