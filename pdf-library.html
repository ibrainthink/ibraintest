<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iBrain | 문제자료실</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pdf-library.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand">iBrain</div><div class="brand-sub">테스트지 평가 시스템</div><nav><a href="dashboard.html">학생 목록</a><a class="active" href="pdf-library.html">문제자료실</a><a href="admin.html" id="adminLink" hidden>관리자 페이지</a></nav><div class="spacer"></div><div class="user-email" id="userEmail"></div><button class="logout-btn" id="logoutBtn">로그아웃</button></aside>
<main class="main"><div class="page-head"><div><h2>문제자료실</h2><p>영역과 별 난이도를 선택해 문제를 확인하세요.</p></div><button id="reload" class="btn-ghost" disabled>목록 새로고침</button></div>
<p id="status" role="status" aria-live="polite">로그인 확인 중…</p>
<section class="pdf-filters"><label>① 영역<select id="domain" disabled><option value="">영역 선택</option></select></label><label>② 별 난이도<select id="stars" disabled><option value="">난이도 선택</option></select></label><label>파일명 검색<input id="search" type="search" placeholder="연령·문제명 검색" disabled></label></section>
<div class="pdf-layout"><section><h3>③ PDF 목록</h3><p id="count"></p><div id="files" class="pdf-files"><p>영역을 먼저 선택하세요.</p></div></section>
<section class="pdf-preview"><h3>④ 미리보기</h3><p id="selected">PDF를 선택하세요.</p><div class="pdf-actions"><button id="print" class="btn-primary" disabled>인쇄</button><button id="open" class="btn-ghost" disabled>PDF 새 창에서 열기</button></div><p class="pdf-hint">미리보기가 지원되지 않는 기기에서는 새 창에서 PDF를 열어 인쇄하세요.</p><iframe id="preview" title="평가문제 PDF 미리보기" hidden></iframe></section></div>
</main></div><script type="module" src="pdf-library.js"></script></body></html>
