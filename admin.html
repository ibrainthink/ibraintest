<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iBrain | 관리자</title><link rel="stylesheet" href="style.css">
<style>
:root{--nav:#20395e;--ink:#1b2f4b;--line:#d7e0ea;--soft:#f6f8fb;--orange:#df8d32}*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}.admin-top{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20;padding:10px 18px;display:flex;align-items:center;gap:18px}.brand{font-size:22px;font-weight:900;white-space:nowrap}.admin-top nav{display:flex;gap:5px;flex:1}.admin-top a{color:#fff;text-decoration:none;font-weight:800;padding:10px 12px;border-radius:9px;white-space:nowrap}.admin-top a.active{background:#ffffff2b}.tools{display:flex;align-items:center;gap:6px}.tools button{height:40px;min-width:40px;border:1px solid #ffffff70;border-radius:9px;background:transparent;color:#fff;font-size:18px;font-weight:800}.tools .logout{font-size:14px;padding:0 10px}.admin-main{width:min(1100px,100%);margin:auto;padding:26px 20px 60px;font-size:calc(17px * var(--admin-scale,1))}.head h1{margin:0 0 6px;font-size:1.8em}.head p{margin:0;color:#65758b}.section-title{font-size:1.25em;font-weight:900;margin:30px 0 12px}.empty-state,.loading-line{background:#fff;border:1px dashed var(--line);padding:25px;border-radius:14px;color:#778}.user-cards{display:grid;gap:10px}.user-card{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.field small{display:block;color:#7b8798;font-size:.72em;margin-bottom:4px}.field strong,.field span{overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions button{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-weight:800;color:var(--ink)}.actions .approve{background:var(--orange);border-color:var(--orange);color:#fff}.actions .danger{color:#a33}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#eaf1fa;font-size:.8em;font-weight:800}.email-bottom{margin-top:25px;color:#778;font-size:.78em}
@media(max-width:700px){.admin-top{display:grid;grid-template-columns:1fr auto;padding:8px 10px;gap:5px 8px}.brand{font-size:18px}.admin-top nav{grid-column:1/-1;grid-row:2;overflow-x:auto}.admin-top a{font-size:14px;padding:8px 10px}.tools .logout{display:none}.tools .word{display:none}.admin-main{padding:18px 12px 45px}.head h1{font-size:1.55em}.user-card{grid-template-columns:1fr 1fr;gap:12px}.field.email{grid-column:1/-1}.actions{grid-column:1/-1;justify-content:flex-start}.actions button{flex:1;min-height:42px}.section-title{margin-top:24px}}
</style></head><body>
<header class="admin-top"><div class="brand">iBrain</div><div class="tools"><span class="word">글씨크기</span><button id="fontDown">−</button><span id="fontLabel">100%</span><button id="fontUp">＋</button><button id="logoutBtn" class="logout">로그아웃</button></div><nav><a href="dashboard.html">학생 목록</a><a href="library.html">문제자료실</a><a class="active" href="admin.html">관리자</a></nav></header>
<main class="admin-main"><div class="head"><h1>계정 관리</h1><p>가입 승인 및 사용자 권한을 관리합니다.</p></div><div class="section-title">승인 대기중</div><div id="pendingBox" class="loading-line">불러오는 중…</div><div class="section-title">승인된 사용자</div><div id="approvedBox" class="loading-line">불러오는 중…</div><div id="userEmail" class="email-bottom"></div></main>
<script type="module">
import{auth,db}from'./firebase-config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';import{doc,getDoc,collection,onSnapshot,updateDoc,deleteDoc,query,orderBy}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
let myUid=null,level=Number(localStorage.getItem('iBrainFontLevel')||0);const $=id=>document.getElementById(id);function font(){level=Math.max(-2,Math.min(5,level));const n=1+level*.1;document.documentElement.style.setProperty('--admin-scale',n);$('fontLabel').textContent=Math.round(n*100)+'%';localStorage.setItem('iBrainFontLevel',level)}$('fontDown').onclick=()=>{level--;font()};$('fontUp').onclick=()=>{level++;font()};font();$('logoutBtn').onclick=()=>signOut(auth).then(()=>location.href='index.html');const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(u,pending){return `<div class="user-card"><div class="field"><small>이름</small><strong>${esc(u.name)||'-'}</strong></div><div class="field"><small>소속</small><span>${esc(u.institution)||'-'}</span></div><div class="field email"><small>이메일</small><span>${esc(u.email)||'-'}</span></div><div class="actions">${pending?`<button class="approve" data-approve="${u.id}">승인</button><button class="danger" data-reject="${u.id}">거절(삭제)</button>`:(u.id===myUid?`<span class="badge">${u.isAdmin?'관리자 · 본인':'본인 계정'}</span>`:`<span class="badge">${u.isAdmin?'관리자':'일반'}</span><button data-revoke="${u.id}">승인 취소</button>`)}</div></div>`}
function renderPending(list){const b=$('pendingBox');b.className=list.length?'user-cards':'empty-state';b.innerHTML=list.length?list.map(u=>card(u,true)).join(''):'승인 대기중인 계정이 없습니다.';b.querySelectorAll('[data-approve]').forEach(x=>x.onclick=()=>updateDoc(doc(db,'users',x.dataset.approve),{approved:true}));b.querySelectorAll('[data-reject]').forEach(x=>x.onclick=()=>{if(confirm('이 가입 신청을 거절하고 삭제할까요?'))deleteDoc(doc(db,'users',x.dataset.reject))})}
function renderApproved(list){const b=$('approvedBox');b.className=list.length?'user-cards':'empty-state';b.innerHTML=list.length?list.map(u=>card(u,false)).join(''):'승인된 사용자가 없습니다.';b.querySelectorAll('[data-revoke]').forEach(x=>x.onclick=()=>{if(confirm('이 사용자의 승인을 취소할까요?'))updateDoc(doc(db,'users',x.dataset.revoke),{approved:false})})}
function watch(){onSnapshot(query(collection(db,'users'),orderBy('createdAt','desc')),s=>{const a=s.docs.map(d=>({id:d.id,...d.data()}));renderPending(a.filter(u=>!u.approved));renderApproved(a.filter(u=>u.approved))})}
onAuthStateChanged(auth,async u=>{if(!u){location.href='index.html';return}const d=await getDoc(doc(db,'users',u.uid));if(!d.exists()||!d.data().approved){await signOut(auth);location.href='index.html';return}if(!d.data().isAdmin){alert('관리자만 접근할 수 있습니다.');location.href='dashboard.html';return}myUid=u.uid;$('userEmail').textContent=u.email||'';watch()});
</script></body></html>
