<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iBrain | 문제자료실</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pdf-library.css">
</head>
<body>
<div class="library-app">
  <header class="library-topbar">
    <div class="brand-row"><strong>iBrain</strong><span>문제자료실</span></div>
    <div class="top-actions">
      <div class="font-control" aria-label="글씨 크기 조절">
        <span>글씨크기</span>
        <button id="fontDown" type="button" aria-label="글씨 작게">−</button>
        <span id="fontLabel">100%</span>
        <button id="fontUp" type="button" aria-label="글씨 크게">＋</button>
      </div>
      <button id="logoutBtn" class="logout-small" type="button">로그아웃</button>
    </div>
    <nav>
      <a href="dashboard.html">학생 목록</a>
      <a class="active" href="library.html">문제자료실</a>
      <a href="admin.html" id="adminLink" hidden>관리자</a>
    </nav>
  </header>

  <main class="library-main">
    <div class="library-head">
      <div><h1>문제자료실</h1><p>영역·난이도·개수를 골라 원하는 문제를 뽑으세요.</p></div>
      <button id="reload" class="btn-ghost" disabled>목록 새로고침</button>
    </div>
    <p id="status" role="status" aria-live="polite">로그인 확인 중…</p>

    <section class="builder-card">
      <div class="builder-grid">
        <label>영역<select id="domain" disabled><option value="">영역 선택</option></select></label>
        <label>별 난이도<select id="stars" disabled><option value="">난이도 선택</option></select></label>
        <label>문제 개수<select id="qty" disabled><option value="">개수 선택</option></select></label>
        <button id="addSet" class="btn-primary add-btn" disabled>＋ 추가</button>
      </div>

      <div class="bundle-head"><strong>선택한 구성</strong><span id="totalCount">총 0개</span></div>
      <div id="bundle" class="bundle-list"><p class="empty">위에서 영역·난이도·개수를 선택해 추가하세요.</p></div>
      <div class="bundle-actions">
        <button id="clearBundle" class="btn-ghost" disabled>전체 비우기</button>
        <button id="reroll" class="btn-ghost" disabled>↻ 다시 뽑기</button>
        <button id="makePreview" class="btn-primary" disabled>미리보기 만들기</button>
      </div>
    </section>

    <section class="preview-card">
      <div class="preview-title">
        <div><h2>미리보기</h2><p id="selected">문제 구성을 만든 뒤 미리보기를 눌러주세요.</p></div>
        <div class="preview-actions">
          <button id="print" class="btn-primary" disabled>전체 인쇄</button>
          <button id="open" class="btn-ghost" disabled>새 창에서 열기</button>
        </div>
      </div>
      <div id="previewList" class="preview-list"><p class="empty">아직 선택된 문제가 없습니다.</p></div>
      <iframe id="preview" title="PDF 미리보기" hidden></iframe>
      <p class="pdf-hint">목록의 PDF를 누르면 바로 미리보기 됩니다. 전체 인쇄는 선택한 PDF 인쇄 목록을 엽니다.</p>
    </section>
    <div id="userEmail" class="user-email-bottom"></div>
  </main>
</div>
<script type="module" src="pdf-library.js"></script>
</body>
</html>
